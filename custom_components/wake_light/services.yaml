command:
  name: Command
  description: >
    Apply one idempotent expected-revision command to a Wake Light room
    profile. Source-bound SleepyPod alarms are read-only; native one-time
    alarms may request HA-owned temporary bed alarms through bed_sides.
  fields:
    profile_id:
      name: Profile ID
      required: true
      selector:
        text: {}
    expected_revision:
      name: Expected revision
      required: true
      selector:
        number:
          min: 0
          mode: box
    request_id:
      name: Request ID
      description: Stable opaque idempotency token for this exact payload.
      required: true
      selector:
        text: {}
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
            - upsert_alarm
            - delete_alarm
            - update_defaults
            - link_alarm
            - dismiss
            - cancel_occurrence
            - end_episode
    alarm:
      name: Alarm
      description: >
        Native alarm object for upsert_alarm. Contract 5 accepts bed_sides on
        dated one-time alarms and owns temporary SleepyPod cleanup.
      required: false
      selector:
        object: {}
    alarm_id:
      name: Alarm ID
      required: false
      selector:
        text: {}
    enabled:
      name: Enabled
      required: false
      selector:
        boolean: {}
    defaults:
      name: Defaults
      description: Ramp and fixed post-wake hold settings.
      required: false
      selector:
        object: {}
    link_keys:
      name: Alarm link keys
      description: >-
        Wake-light link keys for one source alarm, one per execution day and
        formatted as source_ref#weekday#HH:MM such as
        sleepypod:right#monday#06:30.
      required: false
      selector:
        object: {}
    occurrence_id:
      name: Occurrence ID
      required: false
      selector:
        text: {}
